<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" stroke-linecap="round" stroke-linejoin="round">
  <!-- Painted Realms title scene: a ruined castle above a misty valley, seen from a rocky overlook through a broken arch. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#151c28"/><stop offset=".45" stop-color="#2c394b"/><stop offset=".72" stop-color="#55657a"/><stop offset="1" stop-color="#7b8a9c"/>
    </linearGradient>
    <linearGradient id="warmBand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f2c27a" stop-opacity="0"/><stop offset=".35" stop-color="#f2c27a" stop-opacity=".55"/><stop offset=".7" stop-color="#f7d79a" stop-opacity=".8"/><stop offset="1" stop-color="#f2c27a" stop-opacity=".2"/>
    </linearGradient>
    <linearGradient id="mistBand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c3cfdc" stop-opacity="0"/><stop offset=".5" stop-color="#c3cfdc" stop-opacity=".75"/><stop offset="1" stop-color="#c3cfdc" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bridgeFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".45" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="bridgeMask"><rect x="520" y="300" width="420" height="260" fill="url(#bridgeFade)"/></mask>
    <linearGradient id="leftShade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0b0f16" stop-opacity=".9"/><stop offset=".3" stop-color="#0b0f16" stop-opacity=".55"/><stop offset=".48" stop-color="#0b0f16" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="vignette" cx=".62" cy=".45" r=".75">
      <stop offset=".55" stop-color="#0b0f16" stop-opacity="0"/><stop offset="1" stop-color="#0b0f16" stop-opacity=".7"/>
    </radialGradient>
    <radialGradient id="sunGlow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#f7d79a" stop-opacity=".7"/><stop offset="1" stop-color="#f7d79a" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="10"/></filter>
    <filter id="haze" x="-20%" y="-80%" width="140%" height="260%"><feGaussianBlur stdDeviation="22"/></filter>
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="7"/><feColorMatrix values="0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 .55 0"/></filter>
  </defs>

  <!-- sky -->
  <rect width="1280" height="720" fill="url(#sky)"/>
  <ellipse cx="940" cy="250" rx="260" ry="90" fill="url(#sunGlow)"/>
  <!-- heavy cloud masses with a break where the light comes through -->
  <g filter="url(#soft)">
    <path d="M180 120c80-40 220-50 330-20 90-36 210-30 300 6 110-30 260-20 470 10V0H180z" fill="#1d2634"/>
    <path d="M380 200c70-30 170-26 240-4 80-24 180-20 260 2 70-16 170-14 400 10v-60c-180-40-360-36-520-10-140-30-300-20-380 62z" fill="#2a3546"/>
    <path d="M520 300c90-24 220-22 330-8 100-14 260-12 430 12v40c-200-10-380-8-560 6-80 4-160-14-200-50z" fill="#3e4c60" opacity=".9"/>
  </g>
  <!-- the thin band of warm light -->
  <g filter="url(#haze)"><rect x="420" y="232" width="900" height="36" transform="rotate(-4 860 250)" fill="url(#warmBand)"/></g>
  <rect x="560" y="246" width="760" height="5" transform="rotate(-4 940 248)" fill="url(#warmBand)" filter="url(#soft)" opacity=".9"/>

  <!-- far ridge and the dragon -->
  <path d="M120 360l90-60 70 30 110-90 80 50 70-40 120 90 90-50 110 60 140-80 120 70 160-40v200H120z" fill="#5d6c80"/>
  <g transform="translate(700 136) scale(.8)" fill="#141a23">
    <path d="M136 94L10 0Q39 18 40 52Q69 70 70 104Z"/>
    <path d="M148 90L176-6Q170 22 152 40Q132 76 90 98Z"/>
    <ellipse cx="106" cy="104" rx="46" ry="15" transform="rotate(-12 106 104)"/>
    <path d="M146 96C160 92 172 84 184 74L190 80C178 92 164 102 150 106Z"/>
    <path d="M180 72L167 56L188 67Q191 71 195 68L209 71L211 78L202 79L203 83L187 87Z"/>
    <path d="M66 106C36 108 26 130 6 132C-14 134-24 122-30 112C-22 128-10 140 6 140C30 138 40 118 68 118Z"/>
  </g>
  <!-- middle ridges -->
  <path d="M0 420l120-50 90 30 130-70 110 60 90-30 160 70 120-40v260H0z" fill="#45546a"/>
  <path d="M480 450c120-40 240-46 360-30v300H480z" fill="#3b495d"/>
  <!-- valley mist -->
  <g filter="url(#haze)">
    <rect x="80" y="400" width="1200" height="110" fill="url(#mistBand)"/>
    <ellipse cx="700" cy="470" rx="320" ry="40" fill="#c3cfdc" opacity=".55"/>
  </g>

  <g transform="translate(0 -56)">
  <!-- the crag under the castle -->
  <path d="M820 790c10-130 20-290 70-400l70-40 120 6 90-20 80 30 30 40v384z" fill="#2c3644"/>
  <path d="M890 390l70-40 40 120-60 120zM1080 356l90-20-20 140-80 60z" fill="#36424f"/>
  <path d="M960 350l40 120M1170 336l-20 140M1000 470l-60 120" stroke="#2c3646" stroke-width="3" fill="none"/>
  <path d="M822 780c10-130 20-286 68-390l70-40" stroke="#e6b672" stroke-width="3" fill="none" opacity=".55"/>

  <!-- the stone bridge, fading into the fog -->
  <g mask="url(#bridgeMask)">
    <path d="M540 340h380v20H540z" fill="#4a5568"/>
    <path d="M540 360h380v26H540z" fill="#3c4757"/>
    <path d="M556 386h22v170h-22zM646 386h22v170h-22zM736 386h22v170h-22zM826 386h22v170h-22z" fill="#3c4757"/>
    <path d="M578 386q34 48 68 0M668 386q34 48 68 0M758 386q34 48 68 0" fill="#55657a"/>
    <path d="M540 340h380" stroke="#e6b672" stroke-width="2.500" opacity=".6"/>
    <path d="M548 330h12v10h-12zM600 330h12v10h-12zM700 330h12v10h-12zM760 330h12v10h-12zM860 330h12v10h-12z" fill="#4a5568"/>
  </g>

  <!-- the castle -->
  <!-- gatehouse -->
  <path d="M900 386V284l10-12h56l10 12v102z" fill="#4a5568"/>
  <path d="M900 284h14v-14h12v14h12v-14h12v14h14v-14h12v14" fill="#4a5568"/>
  <path d="M922 386v-34c0-20 32-20 32 0v34z" fill="#1c232e"/>
  <!-- curtain wall with broken battlements -->
  <path d="M976 386V292h150v94z" fill="#414c5e"/>
  <path d="M976 292h12v-12h14v12h14v-12h14v12h16l6-8 10 8h18v-12h14v12h12v-6l10 6" fill="#414c5e"/>
  <path d="M1046 292l-8-14 10 4 6-8 4 18z" fill="#2c3646"/>
  <!-- keep -->
  <path d="M990 330V196h92v134z" fill="#4e5a6d"/>
  <path d="M990 196v-18h14v10h16v-10h14v10h16v-10h14v10h18v18z" fill="#4e5a6d"/>
  <path d="M1012 236h10v26h-10zM1052 236h10v26h-10zM1030 290h12v24h-12z" fill="#1c232e"/>
  <path d="M1020 178l-6 10 12 4z" fill="#2c3646"/>
  <!-- the collapsed tower -->
  <path d="M1120 386V196l10-6 6 14 8-34 10 22 8-12 6 18 12-8v196z" fill="#465265"/>
  <path d="M1136 236h10v24h-10zM1150 300h10v22h-10z" fill="#1c232e"/>
  <path d="M1108 386l-14-24 22 6 4 18zM1192 386l10-20-18 6-4 14z" fill="#3a4557"/>
  <!-- warm light along the edges that face the break in the clouds -->
  <g stroke="#f0c27e" stroke-width="3" fill="none" opacity=".85">
    <path d="M990 330V196M990 178h14M1020 188h14M1050 188h14M1080 178h2"/>
    <path d="M900 386V284M900 270h14M926 270h12M950 270h12"/>
    <path d="M1120 386V196l10-6 6 14 8-34 10 22"/>
    <path d="M976 292V386"/>
  </g>
  <!-- stone texture -->
  <g stroke="#36404f" stroke-width="2" opacity=".7">
    <path d="M996 214h20M1040 222h24M1000 280h18M1056 300h20M1128 260h18M1140 340h16M984 340h22M1090 330h20M908 314h18M940 340h14"/>
  </g>

  </g>
  <!-- mist drifting across the base of the castle and the bridge -->
  <g filter="url(#haze)">
    <ellipse cx="840" cy="440" rx="280" ry="38" fill="#c3cfdc" opacity=".6"/>
    <ellipse cx="600" cy="400" rx="170" ry="30" fill="#c3cfdc" opacity=".6"/>
    <ellipse cx="1060" cy="440" rx="240" ry="30" fill="#b6c3d1" opacity=".45"/>
  </g>

  <!-- the rocky overlook -->
  <path d="M0 610c160-26 330-18 470-2 120 14 240 6 360-14 140-22 300-18 450 6v120H0z" fill="#1b222c"/>
  <path d="M190 606c100-16 200-14 280 2M640 598c80-12 140-14 200-8" stroke="#3c4859" stroke-width="3" fill="none"/>
  <path d="M520 640l20-14 26 6 8 16zM760 650l16-12 22 4 6 12zM980 630l24-16 30 8 6 18zM300 652l14-10 18 4 4 10z" fill="#2a333f"/>
  <path d="M1120 720c0-40 20-70 60-80 40 4 70 30 100 30v50z" fill="#161c25"/>

  <!-- the crumbling arch -->
  <path d="M0 0H690l-14 20 12 14-24 8 8 16-32 6c-56-4-130-2-190 10-100 18-180 64-224 130l-36 64V720H0z" fill="#141a23"/>
  <path d="M190 720V266l34-62c44-64 120-110 220-128 60-12 134-14 190-10" stroke="#2a3443" stroke-width="4" fill="none"/>
  <g stroke="#252e3b" stroke-width="3">
    <path d="M190 330h-60M190 410h-80M190 490h-60M190 570h-80M190 650h-60M110 330v80M130 410v80M110 490v80M130 570v80"/>
    <path d="M232 196l-50-34M300 128l-36-46M392 92l-20-56M484 74l-8-60M580 66l2-58"/>
  </g>

  <!-- quiet left third and vignette -->
  <rect width="1280" height="720" fill="url(#leftShade)"/>
  <rect width="1280" height="720" fill="url(#vignette)"/>
  <!-- painted grain -->
  <rect width="1280" height="720" filter="url(#grain)" opacity=".07"/>
</svg>
